<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            font-size: 16px;
            line-height: 1.7;
            color: #222;
            padding-right: 220px;
        }
        hr {
            margin: 40px 0;
            border: none;
            border-top: 1px solid #ccc;
        }
        img {
            width: 100%;
            border-radius: 4px;
        }
        h1 {font-size:28px;margin:1.5em 0 0.6em;}
        h2 {font-size:24px;margin:1.2em 0 0.5em;}
        blockquote {
            background:#f7f8fa;
            border-left:4px solid #88aadd;
            padding:12px 16px;
        }
        .back {
            display: inline-block;
            margin-bottom: 30px;
            color: #0066cc;
        }
        /* 右侧目录全套样式，复制不能删减 */
        .sidebar-toc {
            position: fixed;
            top: 30px;
            right: 20px;
            width: 180px;
            padding: 16px;
            background: #f7f8fa;
            border-radius: 6px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .sidebar-toc h3 {
            margin-top: 0;
            font-size: 18px;
        }
        .sidebar-toc a {
            display: block;
            margin: 10px 0;
            font-size: 15px;
            color: #0066cc;
            text-decoration: none;
        }
        .sidebar-toc a:hover {
            text-decoration: underline;
        }
        .back-top {
            margin-top: 20px;
            padding-top:10px;
            border-top:1px solid #ddd;
        }
        /* 手机自动隐藏侧边栏 */
        @media (max-width: 1100px) {
            .sidebar-toc {
                display: none;
            }
            body {
                padding-right: 20px;
            }
        }
    </style>
</head>
<!-- 回到顶部必须依赖 id="page-top"，不能删掉 -->
<body id="page-top">
<!-- 右侧悬浮目录容器，必须完整保留 -->
<div class="sidebar-toc">
    <h3>本页目录</h3>
    <!-- ========== 【每换页面，只修改这里的链接文字和锚点】 ========== -->
    <a href="#t1">标题1文字</a>
    <a href="#t2">标题2文字</a>
    <a href="#t3">标题3文字</a>
    <a href="#t4">标题4文字</a>
    <!-- 返回顶部固定不用改 -->
    <a href="#page-top" class="back-top">↑ 返回页面顶部</a>
</div>

<a href="index.html" class="back">← 返回漫画合集目录</a>

<h1>页面大标题</h1>
<hr>
<!-- ========== 【对应上面锚点，每个h2加唯一id】 ========== -->
<h2 id="t1">标题1文字</h2>
<img src="图片链接" alt="">

<hr>
<h2 id="t2">标题2文字</h2>
<img src="图片链接" alt="">

<hr>
<h2 id="t3">标题3文字</h2>
<img src="图片链接" alt="">

<hr>
<h2 id="t4">标题4文字</h2>
<img src="图片链接" alt="">
</body>
</html>
